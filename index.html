<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手書きメモ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

  <!-- ↓見た目なので，CSSで書いている -->
<style>
  :root{
    --bg:#3B4A36; --paper:#FBF7EE; --ink-ui:#F3F1E8; --ink-pen:#232323;
    --accent:#3A5BA0; --accent-ink:#FFFFFF; --muted:#B7C0AE; --border:#4E5D48;
    --btn-bg:#41503A; --btn-bg-hover:#4C5C45; --shadow:0 10px 26px rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1D2419; --paper:#EDE9DD; --ink-ui:#E7E4D8; --accent:#5B7FC7;
      --muted:#8B978A; --border:#333E2D; --btn-bg:#28311F; --btn-bg-hover:#333F2A;
      --shadow:0 10px 26px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1D2419; --paper:#EDE9DD; --ink-ui:#E7E4D8; --accent:#5B7FC7;
    --muted:#8B978A; --border:#333E2D; --btn-bg:#28311F; --btn-bg-hover:#333F2A;
    --shadow:0 10px 26px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink-ui);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    padding: calc(22px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));
    min-height:100%;
  }
  h1{
    font-family:'Yomogi',sans-serif; font-weight:400; font-size:22px;
    color:var(--muted); margin:4px 0 0;
  }
  .row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center;}
  button{
    border:1px solid var(--border); background:var(--btn-bg); color:var(--ink-ui);
    border-radius:999px; padding:9px 14px; font-size:13.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  button:hover{background:var(--btn-bg-hover);}
  button:active{transform:scale(.95);}
  button.active{outline:2px solid var(--accent); outline-offset:1px;}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .swatch{
    width:26px; height:26px; border-radius:50%; padding:0; border:2px solid transparent;
    box-shadow:none;
  }
  .swatch[data-highlight="1"]{
    border-radius:6px;
  }
  .swatch.sel{
    border-color:var(--ink-ui);
    outline:2px solid var(--ink-ui);
    outline-offset:2px;
  }
  /* 描画領域のオプション */
  .stage{width:min(90vw, 520px); aspect-ratio:91/55; margin:6px 0;}
  canvas{
    width:100%; height:100%; display:block;
    background:var(--paper); border:1px solid var(--border);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }  
  .pagebar{display:flex; align-items:center; gap:10px;}
  #pageLabel{
    font-family:'Yomogi',sans-serif; font-size:18px; color:var(--muted);
    min-width:56px; text-align:center;
  }
  .hint{font-size:12px; color:var(--muted); text-align:center; max-width:420px; line-height:1.6;}
  .toast{
    position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    background:var(--ink-pen); color:var(--paper); padding:8px 18px; border-radius:20px;
    font-size:13px; opacity:0; transition:opacity .25s ease; pointer-events:none; z-index:5;
  }
  .toast.show{opacity:.94;}
</style>
</head>
<body>
  <h1>MeMoMa</h1>

  <!-- ペンのオプション -->
  <div class="row"> 
    <span class="swatch sel" data-color="#232323" style="background:#232323"></span>
    <span class="swatch" data-color="#B5473A" style="background:#B5473A"></span>
    <span class="swatch" data-color="#3A5BA0" style="background:#3A5BA0"></span>
    <span class="swatch" data-color="rgba(255,45,140,0.3)" data-highlight="1" style="background:#FF8FC7"></span>
    <button id="eraserBtn">🩹 けしごむ</button>
    <button id="undoBtn">↩️ UNDO</button>
    <button id="clearBtn">🧹 全消し</button>
  </div>

  <div class="stage"><canvas id="canvas"></canvas></div>

  <div class="pagebar">
    <button id="prevBtn" aria-label="前のページ">◀</button>
    <span id="pageLabel">1 / 1</span>
    <button id="nextBtn" aria-label="次のページ">▶</button>
    <button id="addBtn">＋ 新規</button>
    <button id="delBtn">🗑 削除</button>
  </div>

  <div class="row">
    <button id="copyBtn" class="primary">📋 PNGをコピー</button>
    <button id="popoutBtn">⤢ 新しいタブで開く</button>
  </div>

  <p class="hint">Notionに埋め込んだ状態だとクリップボードへのコピーがブロックされる場合があります。うまくいかない時は「新しいタブで開く」から操作してください。データはこのブラウザ内に自動保存されます。</p>

  <div class="toast" id="toast"></div>

<script> //動的なので，JavaScriptで書いている
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 728, H = 440; // 名刺比率 91:55
  canvas.width = W; canvas.height = H;
  const PAPER = '#FBF7EE';
  const PEN_WIDTH = 2;
  const HILITE_WIDTH = 20;
  const ERASER_WIDTH = 25;
  const STORAGE_KEY = 'handwritten_memo_pad_v1';

  let pages = [{strokes:[]}];
  let current = 0;
  let color = '#232323';
  let isHighlight = false;
  let erasing = false;
  let drawing = false;
  let activeId = null;   // いま描いているペン/指のID
  let raf = 0;           // 描画の間引き用
  let stroke = null;

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d.pages && d.pages.length){ pages = d.pages; current = Math.min(d.current||0, pages.length-1); }
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({pages, current})); }catch(e){}
  }

  function redraw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0,0,W,H);
    for(const s of pages[current].strokes) drawStroke(s);
    document.getElementById('pageLabel').textContent = (current+1) + ' / ' + pages.length;
  }

  function drawStroke(s){
    if(s.points.length < 1) return;
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle = s.erase ? PAPER : s.color;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    const p = s.points;
    ctx.moveTo(p[0].x, p[0].y);
    if(p.length === 1){ ctx.lineTo(p[0].x+0.1, p[0].y+0.1); }
    for(let i=1;i<p.length;i++){
      const mx=(p[i-1].x+p[i].x)/2, my=(p[i-1].y+p[i].y)/2;
      ctx.quadraticCurveTo(p[i-1].x, p[i-1].y, mx, my);
    }
    ctx.stroke();
    ctx.restore();
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
  }

  canvas.addEventListener('pointerdown', e=>{
    e.preventDefault();

     // 前のストロークが終了しきっていなければ強制終了
    if(drawing){
      drawing = false; stroke = null; activeId = null;
    }

    activeId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    drawing = true;
    const w = erasing ? ERASER_WIDTH : (isHighlight ? HILITE_WIDTH : PEN_WIDTH);
    stroke = { color: erasing?PAPER:color, width: w, erase:erasing, points:[getPos(e)] };
    pages[current].strokes.push(stroke);
  });
  
  canvas.addEventListener('pointermove', e=>{
    if(!drawing || e.pointerId!==activeId) return;
    stroke.points.push(getPos(e));
    if(!raf) raf = requestAnimationFrame(()=>{ raf=0; redraw(); });
  });
  function endStroke(e){
    if(!drawing || (e && e.pointerId!==activeId)) return;
    drawing=false; stroke=null; activeId=null; redraw(); save();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('lostpointercapture', endStroke);

  ['touchstart','touchmove'].forEach(t=>canvas.addEventListener(t, e=>e.preventDefault(), {passive:false}));
  canvas.addEventListener('selectstart', e=>e.preventDefault());
  canvas.addEventListener('contextmenu', e=>e.preventDefault());

  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      color = sw.dataset.color; isHighlight = !!sw.dataset.highlight; erasing = false;
      document.getElementById('eraserBtn').classList.remove('active');
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
      sw.classList.add('sel');
    });
  });
   document.getElementById('eraserBtn').addEventListener('click', function(){
    erasing = !erasing;
    this.classList.toggle('active', erasing);
  });
  document.getElementById('undoBtn').addEventListener('click', ()=>{ pages[current].strokes.pop(); redraw(); save(); });
  document.getElementById('clearBtn').addEventListener('click', ()=>{ pages[current].strokes=[]; redraw(); save(); });

  function goTo(idx){
    const stage = document.querySelector('.stage');
    stage.style.transition = 'opacity .12s ease';
    stage.style.opacity = '0';
    setTimeout(()=>{
      current = idx; redraw(); save();
      stage.style.opacity = '1';
    }, 120);
  }
  document.getElementById('prevBtn').addEventListener('click', ()=>{ if(current>0) goTo(current-1); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ if(current<pages.length-1) goTo(current+1); });
  document.getElementById('addBtn').addEventListener('click', ()=>{
    pages.splice(current+1, 0, {strokes:[]});
    goTo(current+1);
  });
  document.getElementById('delBtn').addEventListener('click', ()=>{
    if(pages.length<=1) return;
    pages.splice(current,1);
    goTo(Math.max(0,current-1));
  });
  document.getElementById('popoutBtn').addEventListener('click', ()=>{ window.open(location.href,'_blank'); });

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1500);
  }
  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    try{
      const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      toast('コピーしました 📋');
    }catch(err){
      toast('コピーに失敗。新しいタブで開いて試してください');
    }
  });

  load();
  redraw();
})();
</script>
</body>
</html>
